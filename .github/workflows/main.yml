name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Buildozer Action
        uses: jreleaser/buildozer-action@v1
        with:
          version: 1.5.0
          command: buildozer android debug
          workdir: .
